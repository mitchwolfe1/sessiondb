[workspace]
members = ["crates/types", "crates/adapters", "crates/client", "crates/cli", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
repository = "https://github.com/mitchwolfe1/sessiondb"

[workspace.dependencies]
sessiondb-types = { path = "crates/types" }
sessiondb-adapters = { path = "crates/adapters" }
sessiondb-client = { path = "crates/client" }
anyhow = "1.0"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client", "credentials-process"] }
aws-sdk-s3 = { version = "=1.159.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client", "http-1x"] }
axum = { version = "=0.8.9", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
clap_complete = "4"
directories = "6"
futures-util = "0.3"
hex = "0.4"
http = "1"
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "apple-native", "windows-native"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "uuid", "chrono", "json"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "io-util", "io-std", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "v5", "serde"] }
walkdir = "2"
zip = { version = "7", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0

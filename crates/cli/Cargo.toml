[package]
name = "sessiondb-cli"
description = "Sync and browse coding-agent sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sessiondb"
path = "src/main.rs"

[dependencies]
sessiondb-types.workspace = true
sessiondb-client.workspace = true
sessiondb-adapters.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
clap_complete.workspace = true
chrono.workspace = true
directories.workspace = true
futures-util.workspace = true
hex.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
walkdir.workspace = true
webbrowser.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sessiondb-server = { path = "../server" }
aws-sdk-s3.workspace = true
axum.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rsa = { version = "0.9", features = ["pem"] }
rand08 = { package = "rand", version = "0.8" }
url.workspace = true
zip.workspace = true

[lints]
workspace = true

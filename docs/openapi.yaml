          type: string
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
          description: Planned metadata, not stored by the initial catalog.
      additionalProperties: true
      required:
      - id
      - slug
      - name
    ProjectCreate:
      type: object
      properties:
        slug:

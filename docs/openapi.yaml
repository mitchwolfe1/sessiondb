        schema:
          type: string
      x-first-build: false
      x-implemented: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Validated API-audience access token or member-issued scoped SessionDB
        token; never an ID token. Project associations are not permission scopes.
  responses:
    Problem:
      description: HTTP problem details; see stable code and request_id. 401 authentication,
        403 denied management, 404 absent/inaccessible, 409 conflict/capability, 413
        limit, 429 throttle, 503 dependency.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      additionalProperties: true
      required:
      - status
    ServerInfo:
      type: object
      properties:
        api_version:
          type: string
        server_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            max_files_per_import:
              type: integer
            max_manifest_bytes:
              type: integer
            max_file_bytes:
              type: integer
          additionalProperties: true
      additionalProperties: true
      required:
      - api_version
      - capabilities
      - limits
    AuthConfig:
      type: object
      properties:
        issuer:
          type: string
          format: uri
        audience:
          type: string
        cli_client_id:
          type: string
        flows:
          type: array
          items:
            type: string
            enum:
            - authorization_code_pkce
      additionalProperties: true
      required:
      - issuer
      - audience
      - cli_client_id
      - flows
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - id
      - slug
      - name
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - name
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
      additionalProperties: true
      required:
      - id
      - display_name
    Membership:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        organization_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        status:
          type: string
          enum:
          - active
          - disabled
      additionalProperties: true
      required:
      - user
      - organization_id
      - role
      - status
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      additionalProperties: true
      required:
      - user
      - memberships
    MembershipPatch:
      type: object
      properties:
        role:
          type: string
          enum:
          - owner
          - admin
          - member
      additionalProperties: false
      required:
      - role
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
      additionalProperties: true
      required:
      - id
      - email
      - role
      - status
    InvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
          default: member
      additionalProperties: false
      required:
      - email
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - id
      - organization_id
      - slug
      - name
    TeamCreate:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
      additionalProperties: false
      required:
      - slug
      - name
    TeamPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - name
    TeamMember:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
      additionalProperties: true
      required:
      - team_id
      - user_id
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum:
          - active
          - archived
        creator_id:
          type: string
          format: uuid
      additionalProperties: true
      required:
      - id
      - organization_id
      - slug
      - name
      - status
      - creator_id
    ProjectCreate:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
      required:
      - slug
      - name
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        repository_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
    Token:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - sessions:read
            - sessions:write
            - sources:sync
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        organization_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        session_ids:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
            uniqueItems: true
          - type: 'null'
      additionalProperties: true
      required:
      - id
      - name
      - source_id
      - scopes
      - expires_at
      - revoked
      - organization_id
      - owner_id
      - session_ids
    TokenCreate:
      type: object
      properties:
        name:
          type: string
        source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - sessions:read
            - sessions:write
            - sources:sync
        expires_at:
          type: string
          format: date-time
        session_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          minItems: 1
          description: Optional explicit read/write restriction. Omit for all sessions
            currently accessible to the issuer.
      additionalProperties: false
      required:
      - name
      - scopes
      - expires_at
      allOf:
      - if:
          properties:
            scopes:
              contains:
                const: sources:sync
          required:
          - scopes
        then:
          required:
          - source_id
          properties:
            source_id:
              type: string
              format: uuid
    CreatedToken:
      allOf:
      - $ref: '#/components/schemas/Token'
      - type: object
        properties:
          token:
            type: string
        additionalProperties: true
        required:
        - token
    Harness:
      type: string
      enum:
      - codex
      - claude
      - pi
    Source:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        harness:
          $ref: '#/components/schemas/Harness'
        device_label:
          type: string
        paused:
          type: boolean
        last_synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        root:
          type: string
          minLength: 1
          description: Native harness store path on the source device; not a project
            directory.
        default_visibility:
          type: string
          enum:
          - private
          - organization
          default: private
          description: Initial visibility for newly recognized sessions only.
        owner_id:
          type: string
          format: uuid
      additionalProperties: true
      required:
      - id
      - organization_id
      - harness
      - paused
      - root
      - owner_id
      - default_visibility
    SourceCreate:
      type: object
      properties:
        harness:
          $ref: '#/components/schemas/Harness'
        device_label:
          type: string
        root:
          type: string
          minLength: 1
          description: Native harness store path on the source device; not a project
            directory.
        default_visibility:
          type: string
          enum:
          - private
          - organization
          default: private
          description: Initial visibility for newly recognized sessions only.
      additionalProperties: false
      required:
      - harness
      - device_label
      - root
      examples:
      - harness: claude
        device_label: Ada laptop
        root: /home/ada/.claude/projects
        default_visibility: private
    SourcePatch:
      type: object
      properties:
        paused:
          type: boolean
        device_label:
          type: string
        default_visibility:
          type: string
          enum:
          - private
          - organization
      additionalProperties: false
    SourceFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        path:
          type: string
        generation_id:
          type: string
          format: uuid
        byte_length:
          type: integer
          minimum: 0
        sha256:
          type: string
        version:
          type: string
      additionalProperties: true
      required:
      - id
      - source_id
      - path
      - generation_id
      - byte_length
      - sha256
      - version
    FileGeneration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        byte_length:
          type: integer
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
      additionalProperties: true
      required:
      - id
      - file_id
      - byte_length
      - created_at
      - current
    FileDescriptor:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        byte_length:
          type: integer
          minimum: 0
          maximum: 268435456
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
        expected_version:
          anyOf:
          - type: string
          - type: 'null'
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          default: []
          description: Optional initial labels. Unavailable/archived labels are omitted
            with warnings; later sync preserves catalog edits.
      additionalProperties: false
      required:
      - path
      - byte_length
      - sha256
      - media_type
      - expected_version
    ImportManifest:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        files:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/FileDescriptor'
      additionalProperties: false
      required:
      - source_id
      - files
      examples:
      - source_id: 55555555-5555-4555-8555-555555555555
        files:
        - path: -home-ada/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jsonl
          byte_length: 4096
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          media_type: application/octet-stream
          expected_version: null
    UploadTarget:
      type: object
      properties:
        path:
          type: string
        method:
          type: string
          enum:
          - PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: true
      required:
      - path
      - method
      - url
      - headers
      - expires_at
    ImportFileResult:
      type: object
      properties:
        path:
          type: string
        status:
          type: string
          enum:
          - accepted
          - unchanged
          - suppressed
        version:
          anyOf:
          - type: string
          - type: 'null'
        session_ids:
          type: array
          items:
            type: string
            format: uuid
        error_code:
          anyOf:
          - type: string
          - type: 'null'
        warnings:
          type: array
          items:
            type: string
          description: Bounded classification/processing warnings; an unavailable
            label does not reject valid original bytes.
      additionalProperties: true
      required:
      - path
      - status
    Import:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - awaiting_upload
          - verifying
          - queued
          - processing
          - ready
          - partial
          - failed
          - expired
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UploadTarget'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImportFileResult'
        created_at:
          type: string
          format: date-time
        job_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Stable verification job ID after completion is scheduled. Later
            parsing/indexing jobs do not replace it; import status tracks overall
            processing.
        accepted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Archival acceptance timestamp. A scheduled verification request
            alone leaves this null.
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              detail:
                type: string
            required:
            - code
            - detail
        upload_expires_at:
          type: string
          format: date-time
          description: Upload lease deadline; accepted originals do not expire at
            this time.
      additionalProperties: true
      required:
      - id
      - organization_id
      - source_id
      - status
      - uploads
      - results
      - created_at
      - accepted_at
      - upload_expires_at
      examples:
      - id: 88888888-8888-4888-8888-888888888888
        organization_id: 11111111-1111-4111-8111-111111111111
        source_id: 55555555-5555-4555-8555-555555555555
        status: awaiting_upload
        uploads:
        - path: -home-ada/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jsonl
          method: PUT
          url: https://objects.example.com/sessiondb/staging/example-upload
          headers:
            Content-Type: application/octet-stream
            x-amz-checksum-sha256: qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqo=
          expires_at: '2026-11-15T12:15:00Z'
        results: []
        created_at: '2026-11-15T12:00:00Z'
        accepted_at: null
        upload_expires_at: '2026-11-16T12:00:00Z'
      - id: 88888888-8888-4888-8888-888888888888
        organization_id: 11111111-1111-4111-8111-111111111111
        source_id: 55555555-5555-4555-8555-555555555555
        status: queued
        uploads: []
        results:
        - path: -home-ada/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jsonl
          status: accepted
          version: example-file-version-1
          session_ids: []
          warnings: []
        created_at: '2026-11-15T12:00:00Z'
        accepted_at: '2026-11-15T12:01:00Z'
        upload_expires_at: '2026-11-16T12:00:00Z'
    ProcessingState:
      type: object
      properties:
        parse:
          type: string
          enum:
          - pending
          - ready
          - partial
          - failed
        keyword:
          type: string
          enum:
          - pending
          - ready
          - failed
        embedding:
          type: string
          enum:
          - disabled
          - pending
          - partial
          - ready
          - failed
      additionalProperties: true
      required:
      - parse
      - keyword
      - embedding
    SessionRelation:
      type: object
      properties:
        type:
          type: string
        session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        native_reference:
          anyOf:
          - type: string
          - type: 'null'
        resolved:
          type: boolean
        history_boundary:
          anyOf:
          - $ref: '#/components/schemas/HistoryBoundary'
          - type: 'null'
      additionalProperties: true
      required:
      - type
      - resolved
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        harness:
          $ref: '#/components/schemas/Harness'
        native_session_id:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        recorded_cwd:
          anyOf:
          - type: string
          - type: 'null'
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer
          minimum: 0
        processing:
          $ref: '#/components/schemas/ProcessingState'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/SessionRelation'
        warnings:
          type: array
          items:
            type: string
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        owner_id:
          type: string
          format: uuid
        visibility:
          type: string
          enum:
          - private
          - organization
      additionalProperties: true
      required:
      - id
      - organization_id
      - author_id
      - harness
      - native_session_id
      - title
      - tags
      - updated_at
      - message_count
      - processing
      - relations
      - warnings
      - project_ids
      - owner_id
      - visibility
      examples:
      - id: 66666666-6666-4666-8666-666666666666
        organization_id: 11111111-1111-4111-8111-111111111111
        project_ids:
        - 22222222-2222-4222-8222-222222222222
        owner_id: 44444444-4444-4444-8444-444444444444
        author_id: 44444444-4444-4444-8444-444444444444
        harness: claude
        native_session_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        title: Payment retry investigation
        tags:
        - retries
        recorded_cwd: /home/ada
        visibility: private
        started_at: '2026-11-15T12:00:00Z'
        updated_at: '2026-11-15T12:05:00Z'
        message_count: 8
        processing:
          parse: ready
          keyword: ready
          embedding: disabled
        relations: []
        warnings: []
      - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        organization_id: 11111111-1111-4111-8111-111111111111
        project_ids: []
        owner_id: 44444444-4444-4444-8444-444444444444
        author_id: 44444444-4444-4444-8444-444444444444
        harness: codex
        native_session_id: cccccccc-cccc-4ccc-8ccc-cccccccccccc
        title: Home directory session
        tags: []
        recorded_cwd: /home/ada
        visibility: private
        started_at: '2026-11-15T12:10:00Z'
        updated_at: '2026-11-15T12:15:00Z'
        message_count: 2
        processing:
          parse: ready
          keyword: ready
          embedding: disabled
        relations: []
        warnings: []
    SessionPatch:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        tags:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            maxLength: 100
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 1000
          description: Replacement set; omit to preserve and [] to clear. Never changes

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Nonempty instance-wide API key from SESSIONDB_API_KEY. All key holders
        have identical full access; no login, token exchange, scopes, or identity policy.
  responses:
    Problem:
      description: HTTP problem details; see stable code and request_id. 401 missing/invalid API key,
        404 absent resource, 409 conflict/capability, 413
        limit, 429 throttle, 503 dependency.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

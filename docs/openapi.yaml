openapi: 3.1.1
info:
  title: SessionDB API
  version: 0.3.0-draft
  description: SessionDB design contract with typed normalized content, source-based
    collection, optional project associations, and one instance-wide bearer API key.
    All clients with the key have identical full access. The first implementation
    subset is identified by x-first-build.
servers:
- url: https://sessions.example.com
  description: Illustrative deployment URL
- url: http://athena:6767
  description: Illustrative protected private-network deployment URL
security:
- bearerAuth: []
tags:
- name: sessions
- name: messages
- name: search
- name: sources
- name: embeddings
- name: changes
- name: projects
- name: operations
paths:
  /healthz:
    parameters: []
    get:
      operationId: getLiveness
      tags:
      - operations
      summary: Read process liveness
      description: Read process liveness
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
      x-first-build: true
      x-implemented: true
  /readyz:
    parameters: []
    get:
      operationId: getReadiness
      tags:
      - operations
      summary: Read core dependency readiness
      description: Read core dependency readiness
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
      x-first-build: true
      x-implemented: true
  /v1/info:
    parameters: []
    get:
      operationId: getServerInfo
      tags:
      - operations
      summary: Read version, capabilities, and limits
      description: Requires the instance API key, like every /v1 operation.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
      x-first-build: true
      x-implemented: true
  /v1/projects:
    parameters: []
    get:
      operationId: listProjects
      tags:
      - projects
      summary: List logical project labels
      description: List instance-wide classification labels.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; not a snapshot while data changes.
      x-first-build: false
      x-implemented: false
    post:
      operationId: createProject
      tags:
      - projects
      summary: Create a logical project label
      description: Create an optional classification label in the shared collection.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          headers:
            Location:
              description: Created resource URL
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      x-first-build: false
      x-implemented: false
  /v1/projects/{project_id}:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getProject
      tags:
      - projects
      summary: Read a project
      description: Read a project
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      x-first-build: false
      x-implemented: false
    patch:
      operationId: updateProject
      tags:
      - projects
      summary: Rename a project label
      description: Projects are optional classification labels, without an archive lifecycle.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      x-first-build: false
      x-implemented: false
  /v1/sources:
    parameters: []
    get:
      operationId: listSources
      tags:
      - sources
      summary: List collection sources
      description: List collection sources
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; not a snapshot while data changes.
      - name: harness
        in: query
        schema:
          $ref: '#/components/schemas/Harness'
      x-first-build: true
      x-implemented: true
    post:
      operationId: createSource
      tags:
      - sources
      summary: Register a native harness store
      description: No project or workspace binding. The source root is provenance on the
        client device, not an access boundary.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
          headers:
            Location:
              description: Created resource URL
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
      x-first-build: true
      x-implemented: true
  /v1/sources/{source_id}:
    parameters:
    - name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSource
      tags:
      - sources
      summary: Read source state
      description: Read source state
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
      x-first-build: true
      x-implemented: true
  /v1/sources/{source_id}/files:
    parameters:
    - name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSourceFiles
      tags:
      - sources
      summary: List accepted originals including parse failures
      description: List accepted originals including parse failures
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFilePage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      x-first-build: true
      x-implemented: true
    post:
      operationId: uploadSourceFile
      tags:
      - sources
      summary: Verify, store, and parse one native file
      description: >-
        Send exactly two multipart parts in order: metadata (JSON FileUpload),
        then file (raw JSONL bytes). Missing, extra, or malformed parts are rejected.
        HTTP 200 means verified originals and parsed catalog state are committed.
        Unsupported or malformed native records reject the whole file with HTTP 400 before storage or catalog mutation.
        Identical current size/digest returns unchanged=true even with the previous
        expected_version; otherwise stale expected_version returns 409 version_conflict.
        New paths require explicit expected_version=null. Acceptance is per file,
        never atomic across multiple requests. Retry a disconnected request with
        the same snapshot and a fresh reader.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadata
              - file
              properties:
                metadata:
                  $ref: '#/components/schemas/FileUpload'
                file:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
              file:
                contentType: application/x-ndjson
      responses:
        '200':
          description: Individually accepted file, including parse diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResult'
        default:
          $ref: '#/components/responses/Problem'
      x-first-build: true
      x-implemented: true
  /v1/sources/{source_id}/files/{file_id}/generations:
    parameters:
    - name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listFileGenerations
      tags:
      - sources
      summary: List preserved file generations
      description: List preserved file generations
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileGenerationPage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      x-first-build: false
      x-implemented: false
  /v1/sources/{source_id}/files/{file_id}/content:
    parameters:
    - name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getOriginalContent
      tags:
      - sources
      summary: Download original bytes
      description: Require the instance API key. Range offsets address original uncompressed bytes.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Original bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Original bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      parameters:
      - name: generation_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      - name: Range
        in: header
        schema:
          type: string
      x-first-build: true
      x-implemented: true
  /v1/sessions:
    parameters: []
    get:
      operationId: listSessions
      tags:
      - sessions
      summary: List sessions in the shared collection
      description: List sessions in the shared collection
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      - name: harness
        in: query
        schema:
          $ref: '#/components/schemas/Harness'
        description: ''
      - name: tag
        in: query
        schema:
          type: string
        description: ''
      - name: after
        in: query
        schema:
          type: string
          format: date-time
        description: ''
      - name: before
        in: query
        schema:
          type: string
          format: date-time
        description: ''
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - updated_at
          - -updated_at
          default: -updated_at
        description: ''
      - name: unassigned
        in: query
        schema:
          type: boolean
          default: false
      x-first-build: true
      x-implemented: true
  /v1/sessions/{session_id}:
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSession
      tags:
      - sessions
      summary: Read session metadata and readiness
      description: Read session metadata and readiness
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
      x-first-build: true
      x-implemented: true
    patch:
      operationId: updateSession
      tags:
      - sessions
      summary: Update session metadata
      description: Replace title, tags, and project_ids. [] clears projects; omission preserves
        them. Classification never restricts access.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPatch'
      x-first-build: false
      x-implemented: false
    delete:
      operationId: deleteSession
      tags:
      - sessions
      summary: Delete a session with source suppression
      description: Planned deletion removes the session and suppresses source recreation;
        no generic job resource is exposed.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '204':
          description: Session removed and source recreation suppressed
      x-first-build: false
      x-implemented: false
  /v1/sessions/{session_id}/messages:
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSessionMessages
      tags:
      - sessions
      summary: List recorded messages and optional ancestry
      description: List recorded messages and optional ancestry
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      - name: leaf_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      x-first-build: true
      x-implemented: true
  /v1/sessions/{session_id}/events:
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listSessionEvents
      tags:
      - sessions
      summary: List structural and native events
      description: List structural and native events
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventPage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      x-first-build: false
      x-implemented: false
  /v1/sessions/{session_id}/export:
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: exportSession
      tags:
      - sessions
      summary: Export native files or a normalized projection
      description: native yields a ZIP of original files and a dependency manifest;
        leaf_id is valid only for normalized formats. Reject leaf_id with native as
        400.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - native
          - jsonl
          - sts
          default: native
        description: ''
      - name: leaf_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      x-first-build: true
      x-implemented: true
  /v1/messages/{message_id}:
    parameters:
    - name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getMessage
      tags:
      - messages
      summary: Read one bounded normalized message
      description: Read one bounded normalized message
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      x-first-build: true
      x-implemented: true
  /v1/messages/{message_id}/around:
    parameters:
    - name: message_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: readAroundMessage
      tags: [sessions]
      summary: Read neighboring messages on the anchor's branch
      description: Follow recorded parents and children. At a fork, return the child
        IDs in branch_choices. An optional descendant selects its path through a fork.
      parameters:
      - name: before
        in: query
        schema: {type: integer, minimum: 0, maximum: 50, default: 2}
      - name: after
        in: query
        schema: {type: integer, minimum: 0, maximum: 50, default: 2}
      - name: leaf_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Bounded message previews in conversation order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageContext'}
        default:
          $ref: '#/components/responses/Problem'
      x-first-build: false
      x-implemented: true
  /v1/messages/{message_id}/content:
    parameters:
    - name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getMessageContent
      tags:
      - messages
      summary: Read full normalized message content
      description: Return full normalized content without content_reference previews.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullContent'
      x-first-build: true
      x-implemented: true
  /v1/search:
    parameters: []
    post:
      operationId: searchMessages
      tags:
      - search
      summary: Search accessible sessions with optional project filters
      description: Rank plain keywords by distinct term coverage and cover density across
        eligible exchanges. AND, OR, quotes or -word select web-search matching.
        Return bounded excerpts anchored in the matching original messages. Semantic and hybrid modes currently return 409 embedding_not_configured.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      x-first-build: false
      x-implemented: true
  /v1/embedding-profiles:
    parameters: []
    get:
      operationId: listEmbeddingProfiles
      tags:
      - embeddings
      summary: List profile metadata without credentials
      description: List profile metadata without credentials
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProfilePage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      x-first-build: false
      x-implemented: false
    post:
      operationId: createEmbeddingProfile
      tags:
      - embeddings
      summary: Configure an instance embedding profile
      description: One enabled profile covers eligible
        sessions including unassigned sessions.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProfile'
          headers:
            Location:
              description: Created resource URL
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingProfileCreate'
      x-first-build: false
      x-implemented: false
  /v1/embedding-profiles/{profile_id}:
    parameters:
    - name: profile_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getEmbeddingProfile
      tags:
      - embeddings
      summary: Read a profile without secret configuration
      description: Read a profile without secret configuration
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProfile'
      x-first-build: false
      x-implemented: false
    patch:
      operationId: updateEmbeddingProfile
      tags:
      - embeddings
      summary: Enable or disable an embedding profile
      description: At most one profile is enabled per instance; conflict returns
        409. Model identity fields are immutable.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingProfilePatch'
      x-first-build: false
      x-implemented: false
  /v1/changes:
    parameters: []
    get:
      operationId: listChanges
      tags:
      - changes
      summary: Read collection changes
      description: At-least-once delivery. Reclassification events include previous_project_ids;
        label filters match previous or current associations. All key holders can
        read the feed; project filters only select classification metadata.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: ''
      - name: cursor
        in: query
        schema:
          type: string
        description: Opaque cursor bound to filters and ordering; no snapshot guarantee.
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      x-first-build: false
      x-implemented: false
  /v1/artifacts/{artifact_id}:
    parameters:
    - name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getArtifact
      tags:
      - messages
      summary: Read artifact metadata
      description: Require the instance API key. URLs are server-issued,
        never arbitrary native transcript URLs.
      responses:
        '200':
          description: Authorized artifact metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          $ref: '#/components/responses/Problem'
      x-first-build: false
      x-implemented: true
  /v1/artifacts/{artifact_id}/content:
    parameters:
    - name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getArtifactContent
      tags:
      - messages
      summary: Download artifact content
      description: Require the instance API key. URLs are server-issued,
        never arbitrary native transcript URLs.
      responses:
        '200':
          description: Authorized artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
        '206':
          description: Authorized byte range
          content:

        visibility:
          type: string
          enum:
          - private
          - organization
          description: Owner/admin action, independent of project associations.
      additionalProperties: false
      examples:
      - project_ids:
        - 22222222-2222-4222-8222-222222222222
        tags:
        - retries
    ContentBlock:
      oneOf:
      - $ref: '#/components/schemas/TextBlock'
      - $ref: '#/components/schemas/ReasoningBlock'
      - $ref: '#/components/schemas/ToolCallBlock'
      - $ref: '#/components/schemas/ToolResultBlock'
      - $ref: '#/components/schemas/JsonBlock'
      - $ref: '#/components/schemas/ArtifactBlock'
      - $ref: '#/components/schemas/UnknownBlock'
      - $ref: '#/components/schemas/ContentReferenceBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          reasoning: '#/components/schemas/ReasoningBlock'
          tool_call: '#/components/schemas/ToolCallBlock'
          tool_result: '#/components/schemas/ToolResultBlock'
          json: '#/components/schemas/JsonBlock'
          artifact: '#/components/schemas/ArtifactBlock'
          unknown: '#/components/schemas/UnknownBlock'
          content_reference: '#/components/schemas/ContentReferenceBlock'
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
          - system
          - tool
          - unknown
        native_role:
          anyOf:
          - type: string
          - type: 'null'
        sequence:
          type: integer
          minimum: 0
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        conversation_parent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        truncated:
          type: boolean
        content_url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        revision:
          type: string
        origin:
          type: string
          enum:
          - native_user
          - model
          - tool
          - harness
          - unknown
        provider_response_id:
          anyOf:
          - type: string
          - type: 'null'
        model:
          anyOf:
          - type: string
          - type: 'null'
        provider_usage:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        warnings:
          type: array
          items:
            type: string
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/NativeRecordRef'
      additionalProperties: true
      required:
      - id
      - session_id
      - role
      - sequence
      - timestamp
      - conversation_parent_id
      - content
      - truncated
      - content_url

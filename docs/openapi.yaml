      operationId: getOriginalContent
      tags:
      - sources
      summary: Download original uncompressed bytes
      description: Project read access or the bound source token is required. Omit
        generation_id for current. Range offsets address original bytes. A short-lived
        authorized object redirect is permitted.
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Original bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Original bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '307':
          description: Authorized short-lived download URL
          headers:
            Location:
              schema:
                type: string
                format: uri
      parameters:
      - name: generation_id
        in: query
        schema:
          type: string
          format: uuid
        description: ''
      - name: Range
        in: header
        schema:
          type: string

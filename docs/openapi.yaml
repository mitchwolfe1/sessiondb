components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Validated API audience access token or project-scoped SessionDB
        API token; never an ID token.
  responses:
    Problem:
      description: HTTP problem details; see stable code and request_id. 401 authentication,
        403 denied management, 404 absent/inaccessible, 409 conflict/capability, 413
        limit, 429 throttle, 503 dependency.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      additionalProperties: true
      required:
      - status
    ServerInfo:
      type: object
      properties:
        api_version:
          type: string
        server_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            max_files_per_import:
              type: integer
            max_manifest_bytes:
              type: integer
            max_file_bytes:
              type: integer
          additionalProperties: true
      additionalProperties: true
      required:
      - api_version
      - capabilities
      - limits
    AuthConfig:
      type: object
      properties:
        issuer:
          type: string
          format: uri
        audience:
          type: string
        cli_client_id:
          type: string
        flows:
          type: array
          items:
            type: string
            enum:
            - authorization_code_pkce
      additionalProperties: true
      required:
      - issuer
      - audience
      - cli_client_id
      - flows
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - id
      - slug
      - name
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - name
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
      additionalProperties: true
      required:
      - id
      - display_name
    Membership:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        organization_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        status:
          type: string
          enum:
          - active
          - disabled
      additionalProperties: true
      required:
      - user
      - organization_id
      - role
      - status
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      additionalProperties: true
      required:
      - user
      - memberships
    MembershipPatch:
      type: object
      properties:
        role:
          type: string
          enum:
          - owner
          - admin
          - member
      additionalProperties: false
      required:
      - role
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
      additionalProperties: true
      required:
      - id
      - email
      - role
      - status
    InvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - member
          default: member
      additionalProperties: false
      required:
      - email
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      additionalProperties: true
      required:
      - id
      - organization_id
      - slug
      - name
    TeamCreate:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
      additionalProperties: false
      required:
      - slug
      - name
    TeamPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - name
    TeamMember:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
      additionalProperties: true
      required:
      - team_id
      - user_id
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum:
          - active
          - archived
      additionalProperties: true
      required:
      - id
      - organization_id
      - slug
      - name
      - status
    ProjectCreate:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
      required:
      - slug
      - name
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        repository_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
    ProjectGrant:
      type: object
      properties:
        id:

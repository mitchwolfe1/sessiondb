components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Nonempty instance-wide API key from SESSIONDB_API_KEY. All key holders
        have identical full access; no login, token exchange, scopes, or identity policy.
  responses:
    Problem:
      description: HTTP problem details; see stable code and request_id. 401 missing/invalid API key,
        404 absent resource, 409 conflict/capability, 413
        limit, 429 throttle, 503 dependency.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      additionalProperties: true
      required:
      - status
    ServerInfo:
      type: object
      properties:
        api_version:
          type: string
        server_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        limits:
          type: object
          properties:
            max_files_per_import:
              type: integer
            max_manifest_bytes:
              type: integer
            max_file_bytes:
              type: integer
          additionalProperties: true
      additionalProperties: true
      required:
      - api_version
      - capabilities
      - limits
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string
          enum:
          - active
          - archived
      additionalProperties: true
      required:
      - id
      - slug
      - name
      - status
    ProjectCreate:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        name:
          type: string
        repository_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
      required:
      - slug
      - name
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        repository_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
    Harness:
      type: string
      enum:
      - codex
      - claude
      - pi
    Source:
      type: object
      properties:
        id:
          type: string
          format: uuid
        harness:
          $ref: '#/components/schemas/Harness'
        device_label:
          type: string
        paused:
          type: boolean
        last_synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        root:
          type: string
          minLength: 1
          description: Native harness store path on the source device; not a project
            directory.
      additionalProperties: true
      required:
      - id
      - harness
      - paused
      - root
    SourceCreate:
      type: object
      properties:
        harness:
          $ref: '#/components/schemas/Harness'
        device_label:
          type: string
        root:
          type: string
          minLength: 1
          description: Native harness store path on the source device; not a project
            directory.
      additionalProperties: false
      required:
      - harness
      - device_label
      - root
      examples:
      - harness: claude
        device_label: Ada laptop
        root: /home/ada/.claude/projects
    SourcePatch:
      type: object
      properties:
        paused:
          type: boolean
        device_label:
          type: string
      additionalProperties: false
    SourceFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        path:
          type: string
        generation_id:
          type: string
          format: uuid
        byte_length:
          type: integer
          minimum: 0
        sha256:
          type: string
        version:
          type: string
      additionalProperties: true
      required:
      - id
      - source_id
      - path
      - generation_id
      - byte_length
      - sha256
      - version
    FileGeneration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        byte_length:
          type: integer
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
      additionalProperties: true
      required:
      - id
      - file_id
      - byte_length
      - created_at
      - current
    FileDescriptor:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        byte_length:
          type: integer
          minimum: 0
          maximum: 268435456
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
        expected_version:
          anyOf:
          - type: string
          - type: 'null'
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          default: []
          description: Optional initial labels. Unavailable/archived labels are omitted
            with warnings; later sync preserves catalog edits.
      additionalProperties: false
      required:
      - path
      - byte_length
      - sha256
      - media_type
      - expected_version
    ImportManifest:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        files:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/FileDescriptor'
      additionalProperties: false
      required:
      - source_id
      - files
      examples:
      - source_id: 55555555-5555-4555-8555-555555555555
        files:
        - path: -home-ada/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jsonl
          byte_length: 4096
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          media_type: application/octet-stream
          expected_version: null
    UploadTarget:
      type: object
      properties:
        path:
          type: string
        method:
          type: string
          enum:
          - PUT
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: true
      required:
      - path
      - method
      - url
      - headers
      - expires_at
    ImportFileResult:
      type: object
      properties:
        path:
          type: string
        status:
          type: string
          enum:
          - accepted
          - unchanged
          - suppressed
        version:
          anyOf:
          - type: string
          - type: 'null'
        session_ids:
          type: array
          items:
            type: string
            format: uuid
        error_code:
          anyOf:
          - type: string
          - type: 'null'
        warnings:
          type: array
          items:
            type: string
          description: Bounded classification/processing warnings; an unavailable
            label does not reject valid original bytes.
      additionalProperties: true
      required:
      - path
      - status
    Import:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - awaiting_upload
          - verifying
          - queued
          - processing
          - ready
          - partial
          - failed
          - expired
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UploadTarget'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImportFileResult'
        created_at:
          type: string
          format: date-time
        job_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Stable verification job ID after completion is scheduled. Later
            parsing/indexing jobs do not replace it; import status tracks overall
            processing.
        accepted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Archival acceptance timestamp. A scheduled verification request
            alone leaves this null.
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              detail:
                type: string
            required:
            - code
            - detail
        upload_expires_at:
          type: string
          format: date-time
          description: Upload lease deadline; accepted originals do not expire at
            this time.
      additionalProperties: true
      required:
      - id
      - source_id
      - status
      - uploads
      - results
      - created_at
      - accepted_at
      - upload_expires_at
      examples:
      - id: 88888888-8888-4888-8888-888888888888
        source_id: 55555555-5555-4555-8555-555555555555
        status: awaiting_upload
        uploads:
        - path: -home-ada/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa.jsonl
          method: PUT
          url: https://objects.example.com/sessiondb/staging/example-upload
          headers:

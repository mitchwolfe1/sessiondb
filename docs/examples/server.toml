# Server configuration example; supply real service endpoints and environment secrets.
listen = "0.0.0.0:8080"
public_url = "https://sessions.example.com"

[database]
url_env = "SESSIONDB_DATABASE_URL"

[objects]
provider = "s3"
endpoint = "https://objects.example.com"
bucket = "sessiondb"
region = "us-east-1"
path_style = true
access_key_env = "SESSIONDB_S3_ACCESS_KEY_ID"
secret_key_env = "SESSIONDB_S3_SECRET_ACCESS_KEY"

[auth]
# Required nonempty environment secret; never put the key in this file.
api_key_env = "SESSIONDB_API_KEY"

[limits]
max_file_bytes = 268435456

[telemetry]
log_format = "json"
metrics_listen = "127.0.0.1:9090"

# Proposed server configuration. No server exists yet.
listen = "0.0.0.0:8080"
public_url = "https://sessions.example.com"

[database]
url_env = "SESSIONDB_DATABASE_URL"

[objects]
provider = "s3"
endpoint = "https://objects.example.com"
bucket = "sessiondb"
region = "us-east-1"
path_style = true
upload_url_ttl_seconds = 900
access_key_env = "SESSIONDB_S3_ACCESS_KEY_ID"
secret_key_env = "SESSIONDB_S3_SECRET_ACCESS_KEY"
download_url_ttl_seconds = 60

[auth]
issuer = "https://identity.example.com/realms/acme"
audience = "sessiondb-api"
cli_client_id = "sessiondb-cli"

[bootstrap]
organization_slug = "acme"
organization_name = "Acme Engineering"
owner_issuer = "https://identity.example.com/realms/acme"
owner_subject = "example-owner-subject"

[workers]
parse_concurrency = 2
embedding_concurrency = 2

[limits]
max_files_per_import = 128
max_manifest_bytes = 2097152
max_file_bytes = 268435456

[telemetry]
log_format = "json"
metrics_listen = "127.0.0.1:9090"

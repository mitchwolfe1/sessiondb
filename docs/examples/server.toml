# Supply real endpoints below; set SESSIONDB_DATABASE_URL and SESSIONDB_API_KEY in the environment.
# Static S3 credentials use SESSIONDB_S3_ACCESS_KEY_ID and SESSIONDB_S3_SECRET_ACCESS_KEY.
listen = "0.0.0.0:8080"
public_url = "https://sessions.example.com"
# HTTP is also supported on protected private networks; HTTPS needs a TLS terminator.

[objects]
provider = "s3"
endpoint = "https://objects.example.com"
bucket = "sessiondb"
region = "us-east-1"
path_style = true

[limits]
max_file_bytes = 268435456

[telemetry]
log_format = "json"
metrics_listen = "127.0.0.1:9090"

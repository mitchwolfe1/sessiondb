# Proposed client configuration. Tokens belong in the keychain or environment.
current_context = "acme"

[contexts.acme]
server = "https://sessions.example.com"
organization = "acme"

[[sources]]
context = "acme"
harness = "codex"
root = "~/.codex/sessions"
default_visibility = "private"

[[sources]]
context = "acme"
harness = "claude"
root = "~/.claude/projects"
default_visibility = "private"

[[sources]]
context = "acme"
harness = "pi"
root = "~/.pi/agent/sessions"
default_visibility = "private"

# Optional initial classification. Nonmatching sessions still sync unassigned.
[[project_rules]]
project = "payments"
cwd_under = "~/work/payments"

[sync]
reconcile_interval_seconds = 60
debounce_seconds = 2
upload_concurrency = 4
batch_files = 32

# Client configuration. The API key belongs in the OS store or SESSIONDB_API_KEY.
server = "https://sessions.example.com"

[[sources]]
server = "https://sessions.example.com"
harness = "codex"
root = "~/.codex/sessions"

[[sources]]
server = "https://sessions.example.com"
harness = "claude"
root = "~/.claude/projects"

[[sources]]
server = "https://sessions.example.com"
harness = "pi"
root = "~/.pi/agent/sessions"

[sync]
reconcile_interval_seconds = 60
upload_concurrency = 4

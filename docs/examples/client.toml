# sessiondb connect writes verified per-origin credentials to [api_keys] in this private client file.
server = "https://sessions.example.com"

[members]
"https://sessions.example.com" = "ada"

[[sources]]
server = "https://sessions.example.com"
harness = "codex"
root = "~/.codex/sessions"

[[sources]]
server = "https://sessions.example.com"
harness = "claude"
root = "~/.claude/projects"

[[sources]]
server = "https://sessions.example.com"
harness = "pi"
root = "~/.pi/agent/sessions"

[sync]
reconcile_interval_seconds = 60
upload_concurrency = 4
